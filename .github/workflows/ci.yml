name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    name: .NET build and tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SeatFlow.slnx
      - name: Build (warnings are errors)
        run: dotnet build SeatFlow.slnx --no-restore -c Release
      - name: Unit and integration tests (PostgreSQL, Redis, RabbitMQ in containers)
        run: dotnet test SeatFlow.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults

  python:
    name: Notification service (Python) lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Notification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/Notification/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  images:
    name: Image ${{ matrix.service }}
    needs: [dotnet, python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: catalog, context: ., file: src/Catalog/SeatFlow.Catalog.Api/Dockerfile }
          - { service: booking, context: ., file: src/Booking/SeatFlow.Booking.Api/Dockerfile }
          - { service: payment, context: ., file: src/Payment/SeatFlow.Payment.Api/Dockerfile }
          - { service: gateway, context: ., file: src/Gateway/SeatFlow.Gateway/Dockerfile }
          - { service: notification, context: src/Notification, file: src/Notification/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: seatflow/${{ matrix.service }}:${{ github.sha }}
          # Build only. To publish, log in to ghcr.io, grant `packages: write` and set push: true.
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e-compose:
    name: End-to-end on docker compose
    needs: [dotnet, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the whole system
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Demo scenarios (hold, idempotency, race, payment, refund, e-mail)
        run: bash scripts/demo.sh all
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-kind:
    name: End-to-end on Kubernetes (kind)
    needs: [dotnet, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: seatflow
          config: deploy/kind/cluster.yaml
      - name: Build, load and deploy
        run: bash scripts/kind-up.sh
      - name: Demo against the cluster
        run: bash scripts/demo.sh all
        env:
          BASE_URL: http://localhost:8081
          MAILPIT_URL: http://localhost:8026
      - name: Cluster state
        if: failure()
        run: |
          kubectl -n seatflow get pods -o wide
          kubectl -n seatflow get events --sort-by=.lastTimestamp | tail -50
          for d in catalog booking payment notification gateway; do kubectl -n seatflow logs deploy/$d --all-containers --tail=80 || true; done
