# Demo credentials, committed on purpose so `kubectl apply -k` works out of the box on kind.
# In a real cluster these come from a secret manager (External Secrets, Sealed Secrets, Vault), never from git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
stringData:
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
stringData:
  RABBITMQ_DEFAULT_USER: seatflow
  RABBITMQ_DEFAULT_PASS: seatflow
  ConnectionStrings__RabbitMq: amqp://seatflow:seatflow@rabbitmq:5672
  RABBITMQ_URL: amqp://seatflow:seatflow@rabbitmq:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
stringData:
  ConnectionStrings__Postgres: Host=postgres;Database=catalog;Username=catalog;Password=catalog
---
apiVersion: v1
kind: Secret
metadata:
  name: booking-db
stringData:
  ConnectionStrings__Postgres: Host=postgres;Database=booking;Username=booking;Password=booking
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
stringData:
  ConnectionStrings__Postgres: Host=postgres;Database=payment;Username=payment;Password=payment
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-db
stringData:
  DATABASE_URL: postgresql://notification:notification@postgres:5432/notification
