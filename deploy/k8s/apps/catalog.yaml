apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: seatflow }
spec:
  selector: { app.kubernetes.io/name: catalog }
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: seatflow }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: seatflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # the "app" user of the chiseled .NET images
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Same image, different command: apply EF Core migrations once, before any replica serves traffic.
        - name: migrate
          image: seatflow/catalog
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: catalog-db }
            - secretRef: { name: rabbitmq }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: catalog
          image: seatflow/catalog
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: catalog-db }
            - secretRef: { name: rabbitmq }
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
