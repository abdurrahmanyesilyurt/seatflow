apiVersion: v1
kind: Service
metadata:
  name: booking
  labels: { app.kubernetes.io/name: booking, app.kubernetes.io/part-of: seatflow }
spec:
  selector: { app.kubernetes.io/name: booking }
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  labels: { app.kubernetes.io/name: booking, app.kubernetes.io/part-of: seatflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: booking }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: booking, app.kubernetes.io/part-of: seatflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # the "app" user of the chiseled .NET images
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Same image, different command: apply EF Core migrations once, before any replica serves traffic.
        - name: migrate
          image: seatflow/booking
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: booking-db }
            - secretRef: { name: rabbitmq }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: booking
          image: seatflow/booking
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: booking-db }
            - secretRef: { name: rabbitmq }
          env:
            # Short payment deadline so the late-payment refund can be demoed (tok_slow takes 25 s).
            - { name: Booking__PaymentTimeout, value: "00:00:15" }
            - { name: Booking__ExpiryScanInterval, value: "00:00:02" }
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
