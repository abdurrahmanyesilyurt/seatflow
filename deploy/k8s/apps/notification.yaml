apiVersion: v1
kind: Service
metadata:
  name: notification
  labels: { app.kubernetes.io/name: notification, app.kubernetes.io/part-of: seatflow }
spec:
  selector: { app.kubernetes.io/name: notification }
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels: { app.kubernetes.io/name: notification, app.kubernetes.io/part-of: seatflow }
spec:
  replicas: 2 # competing consumers on one quorum queue; the row lock keeps each e-mail single
  selector:
    matchLabels: { app.kubernetes.io/name: notification }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification, app.kubernetes.io/part-of: seatflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification
          image: seatflow/notification
          envFrom:
            - secretRef: { name: notification-db }
          env:
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: rabbitmq, key: RABBITMQ_URL } }
            - { name: SMTP_HOST, value: mailpit }
            - { name: SMTP_PORT, value: "1025" }
            - { name: JWKS_URL, value: "http://gateway:8080/.well-known/jwks.json" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://dashboard:18890" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
