apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: seatflow }
spec:
  type: NodePort # kind maps node port 30080 to localhost:8081 (deploy/kind/cluster.yaml)
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - name: http
      port: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: seatflow }
spec:
  # One replica: the dev token issuer generates its RSA key at startup. To scale out, mount a shared key
  # (DevIdentity__SigningKeyPath) or move token issuance to a real identity provider.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: seatflow }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: seatflow/gateway
          envFrom:
            - configMapRef: { name: app-config }
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
